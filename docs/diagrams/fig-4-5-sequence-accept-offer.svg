="#5A6E7D" text-anchor="middle">POST /requests (validated)</text><path d="M 340 244 L 780 244" fill="none" stroke="#0B1F3A" stroke-width="1.8"  marker-end="url(#arrNavy)"/><rect x="461.6" y="225" width="196.79999999999998" height="17" fill="#FFFFFF" opacity="0.94"/><text x="560" y="237" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">INSERT service_requests → pending</text><path d="M 340 298 L 560 298" fill="none" stroke="#0B1F3A" stroke-width="1.8"  marker-end="url(#arrNavy)"/><rect x="390.8" y="279" width="118.39999999999999" height="17" fill="#FFFFFF" opacity="0.94"/><text x="450" y="291" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">dispatch(requestId)</text><path d="M 560 352 L 780 352" fill="none" stroke="#0B1F3A" stroke-width="1.8"  marker-end="url(#arrNavy)"/><rect x="560.4" y="333" width="219.2" height="17" fill="#FFFFFF" opacity="0.94"/><text x="670" y="345" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">SELECT candidates (filter + ORDER BY)</text><path d="M 560 406 L 780 406" fill="none" stroke="#0F9D8A" stroke-width="1.8"  marker-end="url(#arrTeal)"/><rect x="549.2" y="387" width="241.6" height="17" fill="#FFFFFF" opacity="0.94"/><text x="670" y="399" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">INSERT dispatch_offers, status → matching</text><path d="M 340 460 L 1000 460" fill="none" stroke="#0B1F3A" stroke-width="1.8"  marker-end="url(#arrNavy)"/><rect x="577.2" y="441" width="185.6" height="17" fill="#FFFFFF" opacity="0.94"/><text x="670" y="453" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">offer delivered (in-app + push)</text><path d="M 1000 514 L 340 514" fill="none" stroke="#0B1F3A" stroke-width="1.8"  marker-end="url(#arrNavy)"/><rect x="596.8" y="495" width="146.39999999999998" height="17" fill="#FFFFFF" opacity="0.94"/><text x="670" y="507" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">PATCH /offers/:id accept</text><path d="M 340 568 L 780 568" fill="none" stroke="#0F9D8A" stroke-width="1.8"  marker-end="url(#arrTeal)"/><rect x="447.6" y="549" width="224.79999999999998" height="17" fill="#FFFFFF" opacity="0.94"/><text x="560" y="561" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">BEGIN · lock rows · conditional update</text><path d="M 780 622 L 340 622" fill="none" stroke="#0F9D8A" stroke-width="1.8"  marker-end="url(#arrTeal)"/><rect x="447.6" y="603" width="224.79999999999998" height="17" fill="#FFFFFF" opacity="0.94"/><text x="560" y="615" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">unique index admits one accepted offer</text><path d="M 340 676 L 780 676" fill="none" stroke="#0B1F3A" stroke-width="1.8"  marker-end="url(#arrNavy)"/><rect x="444.8" y="657" width="230.39999999999998" height="17" fill="#FFFFFF" opacity="0.94"/><text x="560" y="669" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">status → matched · conversation created</text><path d="M 340 730 L 120 730" fill="none" stroke="#0B1F3A" stroke-width="1.8"  marker-end="url(#arrNavy)"/><rect x="154" y="711" width="152" height="17" fill="#FFFFFF" opacity="0.94"/><text x="230" y="723" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">200 + assigned technician</text><path d="M 340 784 L 1000 784" fill="none" stroke="#E8604C" stroke-width="1.8"  marker-end="url(#arrCoral)"/><rect x="574.4" y="765" width="191.2" height="17" fill="#FFFFFF" opacity="0.94"/><text x="670" y="777" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">WebSocket event {type:"message"}</text><text x="48" y="726" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5A6E7D">Losing an offer for any reason (rejection or timeout) cascades to the next candidate; if none remain the request becomes no_match and joins the retry queue.</text>

