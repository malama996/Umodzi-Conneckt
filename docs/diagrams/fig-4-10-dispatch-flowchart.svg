al, sans-serif" font-size="13" font-weight="600" fill="#243746" text-anchor="middle">Create ONE offer</text><text x="825" y="492.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5A6E7D" text-anchor="middle">status → matching, expires_at = now +</text><text x="825" y="506.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5A6E7D" text-anchor="middle">timeout</text><path d="M 825 530 L 825 574" fill="none" stroke="#0B1F3A" stroke-width="1.8"  marker-end="url(#arrNavy)"/><polygon points="825,574 935,616 825,658 715,616" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.6"/><text x="825" y="616.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#243746" text-anchor="middle">accept / reject / timeout</text><path d="M 935 616 L 1010 616" fill="none" stroke="#0F9D8A" stroke-width="1.8"  marker-end="url(#arrTeal)"/><rect x="944.1" y="597" width="56.8" height="17" fill="#FFFFFF" opacity="0.94"/><text x="972.5" y="609" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">accepted</text><rect x="1010" y="570" width="190" height="92" rx="10" fill="#E9F5EA" stroke="#2E7D45" stroke-width="1.6"/><text x="1105" y="603.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#243746" text-anchor="middle">ATOMIC ACCEPT</text><text x="1105" y="620.1" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#5A6E7D" text-anchor="middle">lock rows · conditional update ·</text><text x="1105" y="633.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#5A6E7D" text-anchor="middle">unique index admits exactly one</text><path d="M 715 616 L 640 616 L 640 700 L 210 700 L 210 530" fill="none" stroke="#E8604C" stroke-width="1.7" marker-end="url(#arrCoral)" stroke-dasharray="6 5"/><text x="420" y="692" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#E8604C" text-anchor="middle">reject or timeout → cascade to the next candidate</text><text x="48" y="748" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5A6E7D">There is no weighted score. Selection is an eligibility filter followed by deterministic ordering, which is what the corrected report now states.</text>

