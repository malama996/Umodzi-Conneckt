<text x="48" y="56" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#0B1F3A">Figure 1.1 — Conceptual Framework</text>
<text x="48" y="80" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#5A6E7D">How the researched problem, the implemented mechanisms and the expected outcomes relate</text>
<line x1="48" y1="98" x2="1192" y2="98" stroke="#DDE4EA" stroke-width="1.4"/>
<rect x="48" y="150" width="176" height="210" rx="10" fill="#EBEFF5" stroke="#0B1F3A" stroke-width="1.6"/><text x="136" y="225.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#243746" text-anchor="middle">INPUTS</text><text x="136" y="245.7" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6E7D" text-anchor="middle">Technician profile, skills,</text><text x="136" y="260.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6E7D" text-anchor="middle">service area, availability</text><text x="136" y="274.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6E7D" text-anchor="middle">Customer fault description,</text><text x="136" y="289.3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6E7D" text-anchor="middle">location, urgency</text><rect x="250" y="190" width="176" height="130" rx="10" fill="#E8F6F3" stroke="#0F9D8A" stroke-width="1.6"/><text x="338" y="233.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#243746" text-anchor="middle">CLASSIFICATION</text><text x="338" y="253.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6E7D" text-anchor="middle">Gemini suggests one of 9</text><text x="338" y="267.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6E7D" text-anchor="middle">categories; customer</text><text x="338" y="282.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6E7D" text-anchor="middle">confirms; keyword fallback</text><rect x="452" y="170" width="190" height="170" rx="10" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.6"/><rect x="452" y="170" width="5" height="170" rx="2.5" fill="#0F9D8A"/><text x="547" y="225.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#243746" text-anchor="middle">DISPATCH ENGINE</text><text x="547" y="245.7" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6E7D" text-anchor="middle">Filter: category, area,</text><text x="547" y="260.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6E7D" text-anchor="middle">verified, available Order:</text><text x="547" y="274.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6E7D" text-anchor="middle">workload, jobs, rating One</text><text x="547" y="289.3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6E7D" text-anchor="middle">offer at a time</text><rect x="668" y="170" width="176" height="170" rx="10" fill="#EBEFF5" stroke="#0B1F3A" stroke-width="1.6"/><text x="756" y="233.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#243746" text-anchor="middle">OUTPUTS</text><text x="756" y="253.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6E7D" text-anchor="middle">Offer and response Job</text><text x="756" y="267.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6E7D" text-anchor="middle">status Notifications and</text><text x="756" y="282.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6E7D" text-anchor="middle">chat</text><rect x="870" y="170" width="176" height="170" rx="10" fill="#FDEEEA" stroke="#E8604C" stroke-width="1.6"/><text x="958" y="233.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#243746" text-anchor="middle">OUTCOMES</text><text x="958" y="253.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6E7D" text-anchor="middle">Less search time Better</text><text x="958" y="267.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6E7D" text-anchor="middle">matching Visibility and</text><text x="958" y="282.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6E7D" text-anchor="middle">accountability</text><path d="M 224 255 L 250 255" fill="none" stroke="#0B1F3A" stroke-width="1.8"  marker-end="url(#arrNavy)"/><path d="M 426 255 L 452 255" fill="none" stroke="#0B1F3A" stroke-width="1.8"  marker-end="url(#arrNavy)"/><path d="M 642 255 L 668 255" fill="none" stroke="#0B1F3A" stroke-width="1.8"  marker-end="url(#arrNavy)"/><path d="M 844 255 L 870 255" fill="none" stroke="#0B1F3A" stroke-width="1.8"  marker-end="url(#arrNavy)"/><path d="M 958 340 L 958 396 L 540 396 L 540 340" fill="none" stroke="#E8604C" stroke-width="1.8" marker-end="url(#arrCoral)"/><text x="749" y="386" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#E8604C" text-anchor="middle">Reviews and ratings update the trust signal used by the next dispatch</text><rect x="48" y="436" width="998" height="52" rx="8" fill="#F2F6F9" stroke="#DDE4EA"/><text x="66" y="458" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0B1F3A">Status</text><text x="66" y="476" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#243746">Inputs, classification, dispatch and outputs are implemented and verifiable in the repository. The outcomes are expected benefits and are not yet measured.</text>

