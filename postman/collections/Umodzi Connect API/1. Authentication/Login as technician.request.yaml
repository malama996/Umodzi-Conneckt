$kind: http-request
name: 'Login as technician'
method: POST
url: '{{baseUrl}}/auth/login'
order: 8000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: text
  content: |-
    {
      "email": "{{technicianEmail}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.environment.set('technicianToken', pm.response.json().data.accessToken);
    language: text/javascript
