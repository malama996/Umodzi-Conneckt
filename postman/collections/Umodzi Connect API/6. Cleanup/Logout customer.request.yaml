$kind: http-request
name: 'Logout customer'
method: POST
url: '{{baseUrl}}/auth/logout'
order: 36000
headers:
  - key: 'Authorization'
    value: 'Bearer {{customerToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    language: text/javascript
