$kind: http-request
name: 'Admin overview'
method: GET
url: '{{baseUrl}}/admin/overview'
order: 30000
headers:
  - key: 'Authorization'
    value: 'Bearer {{adminToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('technician counts present', () => pm.expect(pm.response.json().data).to.be.an('object'));
    language: text/javascript
