$kind: http-request
name: 'Audit trail'
method: GET
url: '{{baseUrl}}/admin/audit-events'
order: 34000
headers:
  - key: 'Authorization'
    value: 'Bearer {{adminToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
