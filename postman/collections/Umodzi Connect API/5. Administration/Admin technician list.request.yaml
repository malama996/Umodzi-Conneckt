$kind: http-request
name: 'Admin technician list'
method: GET
url: '{{baseUrl}}/admin/technicians'
order: 32000
headers:
  - key: 'Authorization'
    value: 'Bearer {{adminToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
