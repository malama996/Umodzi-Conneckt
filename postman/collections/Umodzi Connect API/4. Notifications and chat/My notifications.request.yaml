$kind: http-request
name: 'My notifications'
method: GET
url: '{{baseUrl}}/me/notifications'
order: 25000
headers:
  - key: 'Authorization'
    value: 'Bearer {{customerToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
