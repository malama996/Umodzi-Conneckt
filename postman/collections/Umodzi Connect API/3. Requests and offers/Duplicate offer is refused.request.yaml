$kind: http-request
name: 'Duplicate offer is refused'
method: POST
url: '{{baseUrl}}/offers'
order: 22000
headers:
  - key: 'Content-Type'
    value: 'application/json'
  - key: 'Authorization'
    value: 'Bearer {{customerToken}}'
body:
  type: text
  content: |-
    {
      "requestId": "{{requestId}}",
      "technicianId": "{{anyTechnicianId}}",
      "candidateIndex": 0,
      "status": "pending"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('409 when an offer already exists for this request', () => pm.response.to.have.status(409));
    language: text/javascript
