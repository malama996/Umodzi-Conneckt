$kind: http-request
name: 'Invalid status is rejected'
method: PATCH
url: '{{baseUrl}}/requests/{{requestId}}/status'
order: 23000
headers:
  - key: 'Content-Type'
    value: 'application/json'
  - key: 'Authorization'
    value: 'Bearer {{customerToken}}'
body:
  type: text
  content: |-
    {
      "status": "teleported"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 for unknown status', () => pm.response.to.have.status(400));
    language: text/javascript
