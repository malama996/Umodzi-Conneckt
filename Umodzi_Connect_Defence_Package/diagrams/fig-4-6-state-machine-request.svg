<text x="48" y="56" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#0B1F3A">Figure 4.6 — State-Machine Diagram: Service Request Lifecycle</text>
<text x="48" y="80" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#5A6E7D">The seven persisted statuses and the guarded transitions between them</text>
