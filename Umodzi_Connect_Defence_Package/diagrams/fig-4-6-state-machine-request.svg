<rect x="96" y="190" width="168" height="60" rx="30" fill="#EBEFF5" stroke="#0B1F3A" stroke-width="1.6"/><text x="180" y="222.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#243746" text-anchor="middle">pending</text><rect x="340" y="190" width="168" height="60" rx="30" fill="#E8F6F3" stroke="#0F9D8A" stroke-width="1.6"/><text x="424" y="222.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#243746" text-anchor="middle">matching</text><rect x="584" y="190" width="168" height="60" rx="30" fill="#E8F6F3" stroke="#0F9D8A" stroke-width="1.6"/><text x="668" y="222.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#243746" text-anchor="middle">matched</text><rect x="828" y="190" width="168" height="60" rx="30" fill="#FFF6E8" stroke="#D9962B" stroke-width="1.6"/><text x="912" y="222.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#243746" text-anchor="middle">in_progress</text><rect x="1030" y="320" width="168" height="60" rx="30" fill="#E9F5EA" stroke="#2E7D45" stroke-width="1.6"/><text x="1114" y="352.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#243746" text-anchor="middle">completed</text><rect x="584" y="430" width="168" height="60" rx="30" fill="#FDEEEA" stroke="#E8604C" stroke-width="1.6"/><text x="668" y="462.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#243746" text-anchor="middle">no_match</text><rect x="340" y="430" width="168" height="60" rx="30" fill="#EEEEEE" stroke="#7A8896" stroke-width="1.6"/><text x="424" y="462.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#243746" text-anchor="middle">cancelled</text><path d="M 264 220 L 340 220" fill="none" stroke="#0B1F3A" stroke-width="1.8"  marker-end="url(#arrNavy)"/><rect x="259.6" y="201" width="84.8" height="17" fill="#FFFFFF" opacity="0.94"/><text x="302" y="213" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">offer created</text><path d="M 508 220 L 584 220" fill="none" stroke="#0B1F3A" stroke-width="1.8"  marker-end="url(#arrNavy)"/><rect x="517.6" y="201" width="56.8" height="17" fill="#FFFFFF" opacity="0.94"/><text x="546" y="213" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">accepted</text><path d="M 752 220 L 828 220" fill="none" stroke="#0B1F3A" stroke-width="1.8"  marker-end="url(#arrNavy)"/><rect x="764.4" y="201" width="51.199999999999996" height="17" fill="#FFFFFF" opacity="0.94"/><text x="790" y="213" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">started</text><path d="M 996 235 L 1030 320" fill="none" stroke="#0B1F3A" stroke-width="1.8"  marker-end="url(#arrNavy)"/><rect x="981.8" y="258.5" width="62.4" height="17" fill="#FFFFFF" opacity="0.94"/><text x="1013" y="270.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">completed</text><path d="M 584 250 L 584 430" fill="none" stroke="#E8604C" stroke-width="1.8"  marker-end="url(#arrCoral)"/><rect x="491.2" y="321" width="185.6" height="17" fill="#FFFFFF" opacity="0.94"/><text x="584" y="333" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">no candidate / offers exhausted</text><path d="M 584 430 L 340 430" fill="none" stroke="#E8604C" stroke-width="1.8"  marker-end="url(#arrCoral)"/><rect x="416.8" y="411" width="90.39999999999999" height="17" fill="#FFFFFF" opacity="0.94"/><text x="462" y="423" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">retry succeeds</text><path d="M 340 430 L 340 250" fill="none" stroke="#0B1F3A" stroke-width="1.8"  marker-end="url(#arrNavy)"/><rect x="320" y="321" width="40" height="17" fill="#FFFFFF" opacity="0.94"/><text x="340" y="333" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">retry</text><path d="M 752 232 L 508 455" fill="none" stroke="#7A8896" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrNavy)"/><rect x="565.2" y="324.5" width="129.6" height="17" fill="#FFFFFF" opacity="0.94"/><text x="630" y="336.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">cancelled by customer</text><path d="M 996 240 L 884 452" fill="none" stroke="#7A8896" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrNavy)"/><rect x="908.8" y="327" width="62.4" height="17" fill="#FFFFFF" opacity="0.94"/><text x="940" y="339" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5A6E7D" text-anchor="middle">cancelled</text><rect x="48" y="540" width="700" height="130" rx="8" fill="#F2F6F9" stroke="#DDE4EA"/><text x="66" y="566" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0B1F3A">Enforced server-side</text><text x="66" y="590" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#243746">•  Transitions are validated against a matrix, not accepted from the client.</text><text x="66" y="610" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#243746">•  Every transition writes a service_request_events row (actor, role, from, to, reason).</text><text x="66" y="630" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#243746">•  completing a job releases technician capacity; cancelling closes pending offers.</text><text x="66" y="650" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#243746">•  no_match requests are retried by a sweeper at a configurable interval.</text>

