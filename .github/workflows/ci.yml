name: CI Validation

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Prevent concurrent runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Isolated PostGIS for the migration and privacy steps.
      # Pinned to PostgreSQL 18 / PostGIS 3.7 — the versions the schema and the
      # PostGIS dispatch queries are developed and verified against locally.
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: umodzi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d umodzi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s

    # Shared by every step so the app and the scripts never disagree about
    # which database, secret or public URL they are pointing at.
    env:
      DATABASE_URL: postgresql://postgres:test-password@localhost:5432/umodzi_test
      # Throwaway CI-only values. JWT_SECRET must be >= 32 chars or the server
      # fails fast at boot; neither value is a real secret.
      JWT_SECRET: ci-only-jwt-secret-for-github-actions-000000
      ADMIN_EMAIL: admin@umodzi.test
      ADMIN_PASSWORD: ci-only-admin-password
      SEED_DEMO_DATA: 'true'
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: test-vapid-key
      CI: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Backend typecheck
        run: npm run typecheck -w backend

      - name: Backend build
        run: npm run build -w backend

      - name: Frontend typecheck
        run: npm run typecheck -w frontend

      - name: Frontend lint
        run: npm run lint -w frontend

      - name: Frontend format check
        run: npm run format:check -w frontend

      - name: Frontend build
        run: npm run build -w frontend

      - name: Wait for Postgres
        working-directory: backend
        run: |
          node --input-type=module -e '
            import pg from "pg";
            for (let i = 0; i < 30; i += 1) {
              const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
              try {
                await client.connect();
                await client.end();
                console.log("Postgres is accepting connections.");
                process.exit(0);
              } catch {
                await new Promise((resolve) => setTimeout(resolve, 2000));
              }
            }
            console.error("Postgres did not become ready in time.");
            process.exit(1);
          '

      - name: Run database migrations
        run: npm run migrate -w backend

      - name: Backend unit tests (auth, JWT, sessions)
        working-directory: backend
        run: npx tsx scripts/task23-tests.ts

      - name: Classification tests (mocked provider)
        working-directory: backend
        run: npx tsx scripts/task33-classify-tests.ts

      - name: File storage tests (local + stubbed Supabase)
        working-directory: backend
        run: npx tsx scripts/storage-tests.ts

      - name: Frontend integration tests
        working-directory: frontend
        run: npx tsx scripts/task22-tests.ts

      - name: Location privacy tests (live server)
        working-directory: backend
        run: |
          set -euo pipefail
          npx tsx src/server.ts > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          ready=no
          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:3001/health > /dev/null; then
              ready=yes
              break
            fi
            sleep 1
          done

          if [ "$ready" != "yes" ]; then
            echo "Server never became healthy. Log:"
            tail -40 /tmp/server.log
            exit 1
          fi

          npx tsx scripts/task28-3a1-location-privacy-tests.ts

      - name: Server log on failure
        if: failure()
        run: tail -60 /tmp/server.log 2>/dev/null || true
